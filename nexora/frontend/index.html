<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cortex Mail — AI Email Intelligence</title>
    <meta name="description" content="Cortex Mail — AI-powered email intelligence for Gmail. Classify, prioritize, and ask questions about your inbox." />
    <meta name="theme-color" content="#0B0F19" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="google-site-verification" content="YRKCKh9cl0E2zBF8hTggw0ydUvJsK9RoAJ8xQ96zNyU" />
    <script>
      (function () {
        try {
          var key = 'cortex-theme';
          var mode = localStorage.getItem(key);
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'system';
          var resolved = mode === 'system'
            ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : mode;
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'light' ? '#F4F6FA' : '#0B0F19');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
      if (typeof globalThis !== 'undefined' && typeof globalThis.global === 'undefined') {
        globalThis.global = globalThis;
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
