services:
  - type: web
    name: nexora-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Gemini is the only AI provider. This slot used to declare
      # CLAUDE_API_KEY, which the backend never reads, while GEMINI_API_KEY was
      # missing entirely — so a deploy came up with no usable AI key and fell
      # back to keyword matching.
      - key: GEMINI_API_KEY
        sync: false
      # Optional. Leave unset to track the rolling gemini-flash-latest alias;
      # pinning a dated model means it 404s once that version is retired.
      - key: GEMINI_MODEL
        sync: false
