spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:nexora_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: true
  jackson:
    default-property-inclusion: non_null
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
      settings:
        web-allow-others: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,beans

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}

gemini:
  api-key: ${GEMINI_API_KEY:}
  # Rolling alias on purpose. A pinned version (this was gemini-1.5-flash)
  # eventually gets retired, and every call starts returning 404 while the
  # service quietly falls through to the keyword classifier — the failure is
  # invisible. `-latest` tracks the current stable flash model instead.
  model: ${GEMINI_MODEL:gemini-flash-latest}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

app:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  encryption-key: ${ENCRYPTION_KEY}

resilience4j:
  ratelimiter:
    instances:
      brain-query:
        limitForPeriod: 20
        limitRefreshPeriod: 1h
        timeoutDuration: 5s

logging:
  level:
    com.nexora: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
